
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract ZIP
        run: |
          unzip -q TagRus_Android_Starter.zip -d extracted

      - name: Build APK
        run: |
          PROJECT=$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          cd "$(dirname "$PROJECT")"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TagRus-APK
          path: '**/build/outputs/apk/debug/*.apk'
          
